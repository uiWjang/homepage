<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나의 GitHub Pages 회원 공간</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">EXPECTED SCREEN · WEEK 15</p>
          <h1>내 GitHub Pages 회원 공간</h1>
          <p>정적 HTML 화면과 Supabase Auth·Database를 연결한 결과입니다.</p>
        </div>
        <p class="public-url">
          <strong>PUBLIC URL</strong>
          <span>https://사용자명.github.io/저장소명/</span>
        </p>
      </header>
      <p id="status" class="status" role="status" aria-live="polite">
        연결 준비 중
      </p>
      <div class="workspace">
        <section class="card auth-card" aria-labelledby="auth-title">
          <h2 id="auth-title">회원가입 · 로그인</h2>
          <p>확인 메일을 처리한 뒤 같은 화면에서 로그인합니다.</p>
          <form id="auth-form">
            <label for="email">전자우편</label>
            <input id="email" type="email" autocomplete="email" required />
            <label for="password">비밀번호</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="4"
              maxlength="8"
              required
            />
            <small>비밀번호는 4~8자리로 입력합니다.</small>
            <div class="actions">
              <button id="signup" class="signup" type="button">회원가입</button>
              <button type="submit">로그인</button>
            </div>
          </form>
        </section>
        <section class="card session-card" aria-labelledby="session-title">
          <div class="session-heading">
            <div>
              <h2 id="session-title">로그인 상태</h2>
              <p>Supabase 세션과 내 프로필을 확인합니다.</p>
            </div>
            <span
              id="session-dot"
              class="session-dot"
              aria-hidden="true"
            ></span>
          </div>
          <div id="signed-out-state" class="state-box">
            <strong>로그인 전</strong
            ><span>왼쪽 폼에서 회원가입하거나 로그인하세요.</span>
          </div>
          <div id="member-panel" hidden>
            <p id="member-email" class="member-email"></p>
            <form id="profile-form">
              <label for="display-name">표시 이름</label>
              <input id="display-name" maxlength="30" required />
              <label for="introduction">자기소개</label>
              <textarea id="introduction" maxlength="300"></textarea>
              <button type="submit">내 프로필 저장</button>
            </form>
            <button id="logout" class="logout" type="button">로그아웃</button>
          </div>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
